<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    background:white;
    width:400px;
    padding:25px;
    border-radius:15px;
    box-shadow:0 10px 20px rgba(0,0,0,.2);
    text-align:center;
}

h1{
    margin-bottom:20px;
}

.search{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

input{
    flex:1;
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:8px;
    background:#2196F3;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#0d8af0;
}

.card{
    margin-top:20px;
    display:none;
}

.card h2{
    margin-bottom:10px;
}

.data{
    margin:10px 0;
    font-size:18px;
}

#error{
    color:red;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<h1>🌤 Weather Dashboard</h1>

<div class="search">
<input type="text" id="city" placeholder="Enter City Name">
<button onclick="getWeather()">Search</button>
</div>

<div id="error"></div>

<div class="card" id="weatherCard">

<h2 id="cityName"></h2>

<div class="data">🌡 Temperature:
<span id="temp"></span> °C
</div>

<div class="data">💧 Humidity:
<span id="humidity"></span> %
</div>

<div class="data">🌬 Wind Speed:
<span id="wind"></span> m/s
</div>

<div class="data">☁ Weather:
<span id="condition"></span>
</div>

</div>

</div>

<script>

const API_KEY="YOUR_API_KEY";

async function getWeather(){

const city=document.getElementById("city").value.trim();

const error=document.getElementById("error");

const card=document.getElementById("weatherCard");

error.innerHTML="";
card.style.display="none";

if(city===""){
error.innerHTML="Please enter a city.";
return;
}

try{

const response=await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&appid=${API_KEY}`);

if(!response.ok){
throw new Error("City not found");
}

const data=await response.json();

document.getElementById("cityName").innerHTML=data.name+", "+data.sys.country;

document.getElementById("temp").innerHTML=data.main.temp;

document.getElementById("humidity").innerHTML=data.main.humidity;

document.getElementById("wind").innerHTML=data.wind.speed;

document.getElementById("condition").innerHTML=data.weather[0].main;

card.style.display="block";

}

catch(err){
error.innerHTML=err.message;
}

}

</script>

</body>
</html>
